name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, develop, '1.*', 'release/*']

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4.11
        env:
          MYSQL_DATABASE: fight_common
          MYSQL_USER: fight_common
          MYSQL_PASSWORD: fight_common
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root --password=root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: fight_common
          POSTGRES_USER: fight_common
          POSTGRES_PASSWORD: fight_common
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready --username=fight_common --dbname=fight_common"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    strategy:
      matrix:
        php: ['8.5']

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: bcmath, intl, json, pcntl, pdo, pdo_mysql, pdo_pgsql, pdo_sqlite, posix, sockets
          coverage: xdebug
          ini-values: zend.assertions=1

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ matrix.php }}-${{ hashFiles('composer.json') }}
          restore-keys: ${{ runner.os }}-php-${{ matrix.php }}-

      - name: Resolve latest-compatible dependencies
        run: composer update --no-interaction --no-progress --prefer-dist

      - name: Run shared quality gate
        run: ./bin/quality
        env:
          FIGHT_COMMON_MYSQL_DSN: mysql://fight_common:fight_common@127.0.0.1:3306/fight_common
          FIGHT_COMMON_POSTGRESQL_DSN: postgresql://fight_common:fight_common@127.0.0.1:5432/fight_common
