name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, develop, '1.*', 'release/*']

jobs:
  test:
    name: Complete pre-submit gate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run complete pre-submit gate
        run: ./bin/build
